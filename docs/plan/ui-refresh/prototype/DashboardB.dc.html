<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard · Style B Fresh Ledger refined</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
body{background:#f3f5f4;color:#14211f;font-family:'Inter Tight',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none}
.app{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 88px;box-sizing:border-box;background:#fff;border-right:1px solid #dde3e1;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.side .lg{width:44px;height:44px;border-radius:12px;background:#0b6e75;display:grid;place-items:center;margin-bottom:12px;color:#fff;font-weight:800}
.side a{width:72px;min-height:56px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:#55625f;text-decoration:none}
.side a:hover{background:#eef2f1}
.side a.on{background:#dcefee;color:#0a5156}
.main{flex:999 1 560px;min-width:0;padding:28px 32px 48px;box-sizing:border-box;max-width:1300px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.02em}
.sub{margin:4px 0 18px;color:#55625f;font-size:15px}
.bar1{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #dde3e1;background:#fff;font-weight:600;font-size:15px;color:#14211f;text-decoration:none;box-sizing:border-box}
.pill.on{background:#14211f;color:#fff;border-color:#14211f}
.pill.p{background:#0b6e75;color:#fff;border-color:#0b6e75}
.pill b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.card{background:#fff;border:1px solid #dde3e1;border-top:3px solid #0b6e75;border-radius:14px;overflow:hidden}
.lh{display:flex;align-items:baseline;gap:8px;padding:12px 14px 10px}
.lh h3{margin:0;font-size:17px;font-weight:700}
.lh .st{font-size:12.5px;color:#55625f}
.lh .ct{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-weight:600;color:#55625f}
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid #edf1f0}
.row .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .q{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#55625f}
.chip{border-radius:6px;padding:2px 7px;font-size:12px;font-weight:700}
.chip.x{background:#a6321f;color:#fff}.chip.t{background:#fdebd0;color:#7a4100}.chip.s{background:#dcefee;color:#0a5156}.chip.n{background:#eef2f1;color:#3a4744}
.b{width:46px;height:4px;border-radius:4px;background:#e3e9e7;overflow:hidden}.b i{display:block;height:100%;background:#0b6e75}
.more{padding:8px 14px;border-top:1px solid #edf1f0;font-size:12.5px;color:#55625f}
.foot button{width:100%;min-height:44px;border:0;border-top:1px solid #edf1f0;background:#fff;color:#0b6e75;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.foot button:hover{background:#f3f8f8}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></symbol>
<symbol id="i-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h10l2-8H6"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></symbol>
<symbol id="i-set" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
</defs></svg>
<div class="app">
  <aside class="side">
    <div class="lg">CC</div>
    <a href="Main.dc.html" class="on"><svg class="i" aria-hidden="true"><use href="#i-home"/></svg>Kitchen</a>
    <a href="Stock.dc.html"><svg class="i" aria-hidden="true"><use href="#i-box"/></svg>Stock</a>
    <a href="Shopping.dc.html"><svg class="i" aria-hidden="true"><use href="#i-cart"/></svg>Shopping</a>
    <a href="Meals.dc.html"><svg class="i" aria-hidden="true"><use href="#i-cal"/></svg>Meals</a>
    <a href="Stats.dc.html"><svg class="i" aria-hidden="true"><use href="#i-chart"/></svg>Stats</a>
    <a href="#"><svg class="i" aria-hidden="true"><use href="#i-set"/></svg>Settings</a>
  </aside>
  <main class="main">
    <h1>Kitchen</h1>
    <p class="sub">Thu, Nov 19 · 71 items</p>
    <div class="bar1">
      <span class="pill" style="min-width:220px;color:#55625f">Find on the board</span>
      <a class="pill on" href="#">All <b>71</b></a>
      <a class="pill" href="#">Use soon <b>3</b></a>
      <a class="pill" href="#">Running low <b>6</b></a>
      <a class="pill" href="#">Used up <b>0</b></a>
      <a class="pill p" href="#">+ Add item</a>
    </div>
    <section class="grid" aria-label="Where things are kept">
      <sc-for list="{{locs}}" as="loc" hint-placeholder-count="8">
        <article class="card">
          <div class="lh"><h3>{{loc.name}}</h3><span class="st">{{loc.status}}</span><span class="ct">{{loc.total}}</span></div>
          <sc-for list="{{loc.rows}}" as="it" hint-placeholder-count="5">
            <div class="row"><span class="nm">{{it.n}}</span><span class="b"><i style="width: {{it.pct}}%; background: {{it.fill}}"></i></span><span class="chip {{it.cls}}">{{it.chip}}</span></div>
          </sc-for>
          <sc-if value="{{loc.hasMore}}" hint-placeholder-val="{{ false }}"><div class="more">+ {{loc.moreCount}} more</div></sc-if>
          <sc-if value="{{loc.canToggle}}" hint-placeholder-val="{{ false }}"><div class="foot"><button onClick="{{loc.toggle}}">{{loc.toggleLabel}}</button></div></sc-if>
        </article>
      </sc-for>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1260}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: {} }; }
  renderVals() {
    const D = {
      counter: [['Vifon Mi Xao (instant noodles)',3,180,20,true],['ORANGES',0,8,75],['WINTER TIN',0,60,80],['Kosher Salt',0,300,50]],
      freezer: [['Kirkland Signature Brats',0,-1,20,true],['Ground pork (3 lb pack)',0,0,20,true],['PARTY WINGS',0,0,35],['CHEESE FISH TOFU',0,24,70],['VEGGIE ROLLS',0,24,100],['DUMPLING',0,43,60],['SHRIMP 21/25',0,43,60],['Chicken thighs',0,60,100],['Chicken thighs',0,60,100],['Kirkland Signature Baguette',0,125,100],['Eastland Red Chili (8 oz)',0,125,55]],
      fridge: [['Yogurt (CHO 20G)',0,-1,35],['Big Gai Choy (leafy greens)',0,-1,100],['Organic Carrots',0,-1,100],['Roma Tomato',0,-1,60],['Kroger Butter',0,0,75],['Kewpie Mayonnaise',0,12,35],['KS 5DZ EGGS',0,24,85],['Shanghai Choy',0,24,100],['Ssamjang 500g',0,30,100],['Konjac noodles',0,31,100]],
      shelf: [['Condensed milk',0,45,100],['Corn',0,240,100],['Canned Coconut Milk',0,600,100]],
      pantry: [['Whole Almond',0,-1,78],['Chinese Sausage',0,18,45],['SAFACO NUI BIG TUBE',0,57,100]],
      refills: [['BARONA SAUCE FOR CHAR SIU',0,24,100],['Three Crabs Fish Sauce',0,150,50],['Chin Su Chili Sauce (XL)',0,150,100]],
      snacks: [['Boom Chicka Pop Popcorn',0,-1,35],['AZ Green Tea',0,59,65],['G7 COFFEE 20 BAG',0,147,45]],
      spices: [['Sesame Oil (7.4 oz)',0,125,75],['Kroger Baking Powder',0,215,100]]
    };
    const L = [['counter','Counter',4],['freezer','Freezer',11],['fridge','Fridge',10],['shelf','Open Shelf',3],['pantry','Pantry',25],['refills','Refills',13],['snacks','Snacks & Drinks',3],['spices','Spices',2]];
    // row = [name, unused, days (-1 expired), percent, low]
    const rank = (a) => (a[2] < 0 ? 0 : a[2] === 0 ? 1 : a[4] ? 2 : 3 + a[2] / 1000);
    const chipOf = (d) => (d < 0 ? 'Expired' : d === 0 ? 'Today' : d <= 30 ? d + 'd' : Math.round(d / 30) + ' mo');
    const clsOf = (d) => (d < 0 ? 'x' : d === 0 ? 't' : d <= 7 ? 's' : 'n');
    return { locs: L.map(([id, name, total]) => {
      const all = D[id].slice().sort((a, b) => rank(a) - rank(b));
      const open = !!this.state.open[id];
      const shown = open ? all : all.slice(0, 5);
      const exp = all.filter((a) => a[2] < 0).length;
      const low = all.filter((a) => a[4]).length;
      const bits = [];
      if (exp) bits.push(exp + ' expired');
      if (low) bits.push(low + ' low');
      const canToggle = all.length > 5;
      return { name, total, status: bits.join(' · '),
        rows: shown.map((a) => ({ n: a[0], pct: a[3], fill: a[4] ? '#c2570c' : '#0b6e75', cls: clsOf(a[2]), chip: chipOf(a[2]) })),
        hasMore: total > all.length && (!canToggle || open), moreCount: total - shown.length,
        canToggle, toggleLabel: open ? 'Show fewer' : 'Show all ' + total,
        toggle: () => this.setState({ open: Object.assign({}, this.state.open, { [id]: !open }) }) };
    }) };
  }
}
</script>
</body>
</html>
