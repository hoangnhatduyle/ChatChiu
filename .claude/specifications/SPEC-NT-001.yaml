id: SPEC-NT-001
version: 0.1.0
kind: product
title: Notifications on every device (feature.notifications)
status: draft
context_and_scope:
  in_scope:
    - Daily expiry reminder, grouped, at most once a day, tap opens the inventory (F-NT-01)
    - "Today computed in her timezone, sent at her notify hour via an hourly Vercel Schedule (F-NT-02; Q5 default: device timezone, 9:00)"
    - Low-stock alert once per item until restocked (F-NT-03)
    - Per-device test notification with a status readout (F-NT-04)
    - "iPhone: web push from the Home Screen app, with Add to Home Screen steps in a plain Safari tab (D15)"
    - "Fire Max 11: on-device local notifications in the Capacitor shell, only if diagnostics outcome B (D10, D14; roadmap 7.0.2 decides)"
    - VAPID public key from VITE_VAPID_PUBLIC_KEY; re-subscribe on start when the subscription's key differs (step 0.8 fix)
    - One channel per device in push_subscriptions.channel; the server pushes only to web-push devices
    - "Files: features/settings/NotificationsSection.tsx, apps/web/public/sw-push.js, apps/web/src/core/notify/{port.ts, webPush.ts, localNotify.ts}, apps/fire-shell/"
  out_of_scope:
    - Email digest fallback (not needed, D14)
    - Enabling the new send job before cutover step 4 (one sender at a time)
    - Notifications on Android phones other than the Fire (no such device)
  external_dependencies:
    - Web Push (Apple push service for the iPhone)
    - "Vercel Schedules (fallback: one daily cron, roadmap 7.0.11)"
    - "@capacitor/local-notifications, @capacitor/background-runner (Fire shell)"
  shared_schemas:
    - preferences { timezone, notifyHour, expiryAlerts, lowStockAlerts }
    - "push_subscriptions { endpoint, p256dh, auth, channel: web-push|local }"
state_machines:
  - name: device_notifications
    states:
      - UNSUPPORTED
      - NEEDS_HOME_SCREEN
      - OFF
      - PERMISSION_DENIED
      - ON
      - KEY_MISMATCH
    initial: OFF
    transitions:
      - from: OFF
        event: detect_plain_safari_tab
        to: NEEDS_HOME_SCREEN
      - from: OFF
        event: detect_no_push_no_shell
        to: UNSUPPORTED
      - from: OFF
        event: enable_granted
        to: ON
      - from: OFF
        event: enable_denied
        to: PERMISSION_DENIED
      - from: ON
        event: start_sees_different_vapid_key
        to: KEY_MISMATCH
      - from: KEY_MISMATCH
        event: resubscribe
        to: ON
      - from: ON
        event: disable_or_sign_out
        to: OFF
    forbidden:
      - from: KEY_MISMATCH
        to: KEY_MISMATCH
        reason: A mismatched subscription is never kept across an app start (the D17 root cause)
      - from: NEEDS_HOME_SCREEN
        to: ON
        reason: iOS only allows push from the Home Screen app
negative_constraints:
  - id: NC-NT-NO-HARDCODED-VAPID
    message: The VAPID public key MUST NOT be hard-coded in source; it comes from VITE_VAPID_PUBLIC_KEY
    severity: high
  - id: NC-NT-NO-SILENT-FAILURE
    message: Push failures MUST NOT be swallowed; dead subscriptions (404/410) are deleted and failures are recorded readably
    severity: high
  - id: NC-NT-NO-DUPLICATES
    message: A device MUST NOT get the same reminder from both web push and local notifications, nor more than one expiry reminder per local day
    severity: high
  - id: NC-NT-ONE-SENDER
    message: The old and new apps MUST NOT both send scheduled pushes; the new send job stays off until cutover step 4
    severity: critical
  - id: NC-NT-NO-PROD-ENV-WITHOUT-ASK
    message: VAPID keys, CRON_SECRET and schedule settings in production MUST NOT be changed without the user's go-ahead
    severity: critical
acceptance_criteria:
  - id: F-NT-01
    given: three items within their days-before window on her subscribed iPhone (Home Screen app)
    when: her notify hour arrives
    then: one grouped push "3 items expiring soon" arrives, at most once that local day, and tapping it opens the inventory filtered to expiring; on the Fire (outcome B) the shell shows the same reminder with the app closed and after a reboot
    invariant: false
  - id: F-NT-02
    given: timezone America/Toronto and notify hour 9
    when: the hourly schedule runs around local midnight and at 9:00
    then: '"today" is her local date (no off-by-one near midnight) and the reminder is sent in the 9:00 local run'
    invariant: false
  - id: F-NT-03
    given: Butter drops to 15% (threshold 20) on the tablet
    when: the save returns crossedLowStock
    then: '"Butter is running low (15%)" is shown once on that device and once by push to web-push devices, and not again until Butter is restocked'
    invariant: false
  - id: F-NT-04
    given: the Notifications section on a device
    when: she taps Send test
    then: "this device gets a test notification and the status reads \"This device: notifications on ✓\" (or the exact reason it isn't: needs Home Screen, permission denied, unsupported)"
    invariant: false
depends_on:
  - SPEC-DATA-001
  - SPEC-API-001
  - SPEC-AU-001
constitution_rules:
  - AR-ONE-SENDER
  - AR-NO-PROD-WRITES-WITHOUT-ASK
  - CS-DAY-MATHS
  - NC-SECRETS
