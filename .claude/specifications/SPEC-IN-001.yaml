id: SPEC-IN-001
version: 0.1.0
kind: product
title: Inventory list (feature.inventory)
status: active
context_and_scope:
  in_scope:
    - Search by name and notes (F-IN-01)
    - Filters by category, location and status kept in the URL (F-IN-02, F-IN-14)
    - Sort (F-IN-03) and group by place by default (F-IN-04)
    - Shelves view (cards, 2 or 3 to a row on a wide screen) by default, the table as the second view, the choice remembered (F-IN-05)
    - Virtual scrolling instead of pages (F-IN-06)
    - Coloured Expired / Expiring soon / Fresh tiles as quick filters (F-IN-07)
    - Usage drag on cards with Undo, the percent following the finger (F-IN-08)
    - Row tap opens the quick-action panel (F-IN-09)
    - Select mode with bulk delete and Undo (F-IN-10)
    - Waste value = per-unit price × remaining (F-IN-11)
    - Scan receipt button (F-IN-13)
    - Barcode scan and image view stay hidden (F-IN-12, F-IN-09 image, D3)
    - "Files: features/inventory/{InventoryPage, InventoryTable, InventoryCards, InventoryFilters}.tsx; packages/domain/src/filter.ts (ported applyFilters)"
  out_of_scope:
    - Barcode scanning to search and barcode text search (D3, hidden; barcode data untouched)
    - View image (D3, hidden; item_images untouched)
    - Page-number pagination (replaced by virtual scrolling)
  external_dependencies:
    - "@tanstack/react-virtual"
    - DELETE /api/inventory/bulk
  shared_schemas:
    - "URL search params: q, category, location, status (all|expired|expiring|fresh), sort (expiry|name|quantity|recent), group (none|category|location, default location), view (cards|table; an old saved auto reads as cards)"
state_machines:
  - name: bulk_delete
    states:
      - BROWSING
      - SELECTING
      - HIDDEN_LOCALLY
      - UNDONE
      - SENT
      - ROLLED_BACK
    initial: BROWSING
    transitions:
      - from: BROWSING
        event: enter_select_mode
        to: SELECTING
      - from: SELECTING
        event: cancel
        to: BROWSING
      - from: SELECTING
        event: delete_selected
        to: HIDDEN_LOCALLY
      - from: HIDDEN_LOCALLY
        event: undo
        to: UNDONE
      - from: HIDDEN_LOCALLY
        event: window_closed_or_pagehide
        to: SENT
      - from: SENT
        event: server_error
        to: ROLLED_BACK
      - from: UNDONE
        event: settled
        to: BROWSING
      - from: SENT
        event: server_ok
        to: BROWSING
      - from: ROLLED_BACK
        event: dismiss
        to: BROWSING
    forbidden:
      - from: UNDONE
        to: SENT
        reason: An undone bulk delete must never reach the server
negative_constraints:
  - id: NC-IN-ONE-REQUEST
    message: Bulk delete MUST NOT send one request per item; it sends one DELETE /api/inventory/bulk
    severity: medium
  - id: NC-IN-NO-BARCODE-UI
    message: No barcode scan button or image viewer may be rendered (D3), and the new app MUST NOT modify barcode or image data
    severity: high
  - id: NC-IN-NO-LOST-FILTERS
    message: Back navigation and refresh MUST NOT lose the active filters
    severity: medium
  - id: NC-IN-ONE-FILTER-IMPL
    message: Filtering logic MUST NOT be duplicated in components; it lives in packages/domain/src/filter.ts
    severity: medium
acceptance_criteria:
  - id: F-IN-01
    given: items with "oat" in the name of one and in the notes of another, and one whose barcode contains "oat"
    when: she searches "oat"
    then: the first two match and the barcode-only one does not
    invariant: false
  - id: F-IN-02
    given: filters category Dairy, location Fridge, status expiring
    when: she applies them
    then: only matching items show and the URL holds the filters, so Back and refresh keep them; status expiring means within 3 days
    invariant: false
  - id: F-IN-03
    given: the sort control
    when: she picks expiry, name, quantity or recently added
    then: the list orders accordingly (ported applyFilters semantics)
    invariant: false
  - id: F-IN-04
    given: the group control
    when: she picks none, category or location
    then: items are grouped with headers accordingly; with no choice the list is grouped by location (the Shelves view), each group under a shelf-label header with its place's icon and tint
    invariant: false
  - id: F-IN-05
    given: widths 400, 800, 1023, 1024 and 1300 px
    when: the page renders with no choice
    then: the Shelves view at every width (1 card per row below 768 px, 2 from 768 px, 3 from 1280 px, each card numbered in the list); the table only when she picks Table, and that choice is remembered on this device
    invariant: false
  - id: F-IN-06
    given: 300 items
    when: she scrolls
    then: rows (a header, or a row of 1 to 3 cards) are virtualised and there are no page controls
    invariant: false
  - id: F-IN-07
    given: 2 expired, 3 expiring (today to 3 days) and 1 fresh item
    when: the page renders
    then: the Expired, Expiring soon and Fresh tiles show 2, 3 and 1 (counting what the other filters leave); tapping one applies that status filter and tapping the chosen one shows everything again
    invariant: false
  - id: F-IN-08
    given: a card's usage bar
    when: she drags it down and releases
    then: it behaves as F-KB-04 (save on release, Undo, no confirm) and, while the bar moves, the percent, the amount and the Low cue follow it
    invariant: false
  - id: F-IN-09
    given: a row or card
    when: she taps it
    then: the quick-action panel opens (Edit, usage, restock, waste, delete live there); no View image action exists (D3)
    invariant: false
  - id: F-IN-10
    given: select mode with 4 items selected
    when: she taps Delete selected
    then: the 4 disappear with an Undo toast, and one DELETE /api/inventory/bulk is sent after the window; select all / none work
    invariant: false
  - id: F-IN-11
    given: an item with per-unit price 0.40 and 6 left
    when: she moves it to waste
    then: the waste toast and log show value 2.40
    invariant: false
  - id: F-IN-12
    given: the inventory page
    when: it renders
    then: no barcode scan control is present (hidden by D3) and barcode_mappings / inventory_items.barcode are never written by the new app
    invariant: true
  - id: F-IN-13
    given: the inventory page
    when: she taps Scan receipt
    then: the receipt scan flow (SPEC-RS-001) opens
    invariant: false
  - id: F-IN-14
    given: filters set on a previous visit
    when: she opens the inventory page from the nav without URL params
    then: the last-used filters are restored into the URL
    invariant: false
depends_on:
  - SPEC-DATA-001
  - SPEC-API-001
  - SPEC-QP-001
  - SPEC-KB-001
constitution_rules:
  - AR-NO-DIRECT-API
  - AR-ONE-DEFINITION
  - AR-HIDDEN-NOT-DROPPED
  - CS-STATE-HOMES
  - AR-UNDO-KINDS
