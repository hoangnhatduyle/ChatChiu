id: SPEC-AU-001
version: 0.1.0
kind: product
title: Sign-in and account (feature.auth)
status: active
context_and_scope:
  in_scope:
    - Email and password sign-in with a persisted session (F-AU-01)
    - Register with password of at least 12 characters and confirmation (F-AU-02)
    - Forgot password and a working reset-password page (F-AU-03)
    - Session expiry handling on 401 (F-AU-04)
    - Route guard on every page except the auth pages (F-AU-05)
    - Sign out that unregisters only this device's notifications (F-AU-06)
    - "Pages: features/auth/{LoginPage, RegisterPage, ResetPasswordPage}.tsx; core/auth.tsx, core/RequireAuth.tsx"
  out_of_scope:
    - "Separate logins per person / household sharing (D11: one shared login)"
    - Social or SSO login
    - Changing the Supabase Auth email templates or project auth settings (production-facing, ask first)
  external_dependencies:
    - Supabase Auth (signInWithPassword, signUp, resetPasswordForEmail, onAuthStateChange PASSWORD_RECOVERY, updateUser)
  shared_schemas:
    - Session from @supabase/supabase-js; useSession() from core/auth.tsx
state_machines:
  - name: session
    states:
      - SIGNED_OUT
      - SIGNING_IN
      - SIGNED_IN
      - PASSWORD_RECOVERY
      - EXPIRED
    initial: SIGNED_OUT
    transitions:
      - from: SIGNED_OUT
        event: submit_credentials
        to: SIGNING_IN
      - from: SIGNING_IN
        event: auth_ok
        to: SIGNED_IN
      - from: SIGNING_IN
        event: auth_error
        to: SIGNED_OUT
      - from: SIGNED_IN
        event: token_refreshed
        to: SIGNED_IN
      - from: SIGNED_IN
        event: api_401_after_refresh
        to: EXPIRED
      - from: EXPIRED
        event: show_session_expired
        to: SIGNED_OUT
      - from: SIGNED_IN
        event: sign_out
        to: SIGNED_OUT
      - from: SIGNED_OUT
        event: open_recovery_link
        to: PASSWORD_RECOVERY
      - from: PASSWORD_RECOVERY
        event: new_password_saved
        to: SIGNED_IN
    forbidden:
      - from: SIGNED_OUT
        to: SIGNED_IN
        reason: Protected pages are never reachable without passing through sign-in or recovery
      - from: PASSWORD_RECOVERY
        to: SIGNED_OUT
        reason: A recovery link must lead to setting a password, not silently back to login (the F-AU-03 bug)
negative_constraints:
  - id: NC-AU-NO-TOKEN-STORAGE-LEAK
    message: Tokens MUST NOT be logged, put in URLs, or stored anywhere except the Supabase client's own storage
    severity: critical
  - id: NC-AU-SIGNOUT-SCOPE
    message: Sign out MUST NOT remove other devices' push subscriptions or sign other devices out (shared login, D11)
    severity: high
  - id: NC-AU-NO-WEAK-PASSWORD
    message: Registration and reset MUST NOT accept passwords shorter than 12 characters
    severity: high
  - id: NC-AU-NO-ENUMERATION
    message: Forgot-password MUST NOT reveal whether an email has an account
    severity: medium
acceptance_criteria:
  - id: F-AU-01
    given: valid email and password
    when: she signs in and later closes and reopens the app
    then: she lands on the kitchen board still signed in (session persisted)
    invariant: false
  - id: F-AU-02
    given: the register page
    when: she submits a password under 12 characters or a mismatched confirmation
    then: an inline error blocks it; a valid submission creates the account and says to confirm by email when Supabase requires it
    invariant: false
  - id: F-AU-03
    given: she requested a reset email and opens its link
    when: Supabase fires PASSWORD_RECOVERY
    then: the /reset-password page asks for a new password (12+ chars), calls updateUser, and signs her in
    invariant: false
  - id: F-AU-04
    given: a signed-in session whose token can't be refreshed
    when: an API call returns 401
    then: she is signed out once and sees "Your session expired" on the login page; silent refresh is tried first
    invariant: false
  - id: F-AU-05
    given: no session
    when: any page other than login, register or reset-password is opened
    then: she is redirected to login and returned to the requested page after signing in
    invariant: true
  - id: F-AU-06
    given: two devices signed in to the shared account, both with notifications on
    when: she signs out on one
    then: only that device's push subscription is deleted and the other device stays signed in and subscribed (signOut uses scope 'local'; supabase-js defaults to 'global', which would end every device's session)
    invariant: true
depends_on:
  - SPEC-DATA-001
  - SPEC-API-001
constitution_rules:
  - AR-NO-DIRECT-API
  - CS-DATA-HOOKS
  - NC-SECRETS
