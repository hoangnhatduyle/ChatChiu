id: SPEC-KB-001
version: 0.1.0
kind: product
title: Kitchen board (feature.kitchen-board)
status: active
context_and_scope:
  in_scope:
    - One card per location plus a No location card, each showing its 5 most urgent items with Show all N (F-KB-01, F-KB-17)
    - Urgency order inside each card: expired, use today, running low, soonest (F-KB-02)
    - Expiry chip with words (F-KB-03)
    - Down-only usage drag that saves on release with Undo (F-KB-04)
    - Percent and remaining quantity; tapping the name opens the quick-action panel (F-KB-05, F-KB-06)
    - Low-stock bar colour from the item's own threshold (F-KB-07)
    - Used-up toast with Add to shopping list or Remove (F-KB-08, D8)
    - Low-stock alert trigger (F-KB-09) and Running low tile with run-out (F-KB-10)
    - Four clickable tiles Expired, Use today, Running low, Fresh (F-KB-12), header with search, Scan receipt, Add item and per-location add (F-KB-12, F-KB-15); the first-use hint was removed (F-KB-11)
    - Live percentage while a bar is dragged (F-KB-18); a location's own icon and colour with a name-based fallback (F-KB-19)
    - Stats moved to Waste & Stats (F-KB-13), empty state (F-KB-14), live updates between devices (F-KB-16)
    - "Files: features/kitchen-board/{KitchenBoardPage, LocationColumn, BoardRow, BoardFilters}.tsx; prototype https://claude.ai/artifact/Hne1sPMHaXmxVYfs7A4rVJ is the visual reference"
    - "Layout: from 1024 px (desktop, the Fire in landscape) a grid of cards and one page scroll; below 1024 px (phone, portrait tablet) a swipe row of cards, 1 or 2 visible"
  out_of_scope:
    - The old Board/Stats toggle and dashboard stats cards (moved to SPEC-ST-001, D7)
    - The old empty-item Refill dialog (dropped, D8)
    - Usage confirm dialogs (replaced by Undo, D6)
    - Item photos on board rows (D3)
    - "Making the 3-day Use soon window follow each item's days_before (open-questions Q7 default: fixed 3 days)"
  external_dependencies:
    - Supabase Realtime (inventory_items)
    - GET /api/bootstrap, POST /api/inventory/:id/usage, POST /api/inventory/:id/usage-undo
  shared_schemas:
    - "packages/domain: expiry.ts (status, days left), quantity.ts (% left with the quantity fallback), low-stock.ts, run-out.ts, filter.ts"
    - "ui: UsageSlider (5% steps, down-only mode, 4 px tap guard), ExpiryChip, Toast"
state_machines:
  - name: board_usage_change
    states:
      - IDLE
      - DRAGGING
      - APPLIED_LOCALLY
      - SAVED
      - UNDONE
      - ROLLED_BACK
      - QUEUED_OFFLINE
    initial: IDLE
    transitions:
      - from: IDLE
        event: pointer_down
        to: DRAGGING
      - from: DRAGGING
        event: release_moved_under_4px
        to: IDLE
      - from: DRAGGING
        event: release_lower_value
        to: APPLIED_LOCALLY
      - from: APPLIED_LOCALLY
        event: server_ok
        to: SAVED
      - from: APPLIED_LOCALLY
        event: server_error
        to: ROLLED_BACK
      - from: APPLIED_LOCALLY
        event: offline
        to: QUEUED_OFFLINE
      - from: QUEUED_OFFLINE
        event: back_online_ok
        to: SAVED
      - from: QUEUED_OFFLINE
        event: back_online_error
        to: ROLLED_BACK
      - from: SAVED
        event: undo
        to: UNDONE
      - from: QUEUED_OFFLINE
        event: undo
        to: UNDONE
      - from: SAVED
        event: toast_closed
        to: IDLE
      - from: UNDONE
        event: settled
        to: IDLE
      - from: ROLLED_BACK
        event: retry
        to: APPLIED_LOCALLY
      - from: ROLLED_BACK
        event: dismiss
        to: IDLE
    forbidden:
      - from: DRAGGING
        to: SAVED
        reason: The cache is always updated first; nothing reaches the server before the UI shows it
      - from: IDLE
        to: APPLIED_LOCALLY
        reason: A usage change on the board only comes from a released drag; no confirm dialog path exists
  - name: used_up_item
    states:
      - ACTIVE
      - AT_ZERO
      - ON_SHOPPING_LIST
      - REMOVED
    initial: ACTIVE
    transitions:
      - from: ACTIVE
        event: drag_to_zero
        to: AT_ZERO
      - from: AT_ZERO
        event: add_to_shopping_list
        to: ON_SHOPPING_LIST
      - from: AT_ZERO
        event: remove
        to: REMOVED
      - from: ON_SHOPPING_LIST
        event: remove
        to: REMOVED
      - from: AT_ZERO
        event: restock
        to: ACTIVE
      - from: ON_SHOPPING_LIST
        event: restock
        to: ACTIVE
      - from: AT_ZERO
        event: undo_usage
        to: ACTIVE
    forbidden:
      - from: REMOVED
        to: ACTIVE
        reason: Remove is held until the Undo toast closes (hold-until-close undo); a removed row is never restored server-side
negative_constraints:
  - id: NC-KB-NO-CONFIRM
    message: A board usage change MUST NOT open a confirm dialog; it saves on release with an Undo toast (D6)
    severity: high
  - id: NC-KB-NO-HIDDEN-ITEMS
    message: "No item may be missing from the board: items whose location is null or deleted MUST appear in a No location card, and every item of a card MUST be reachable (Show all N)"
    severity: high
  - id: NC-KB-NO-COLOUR-ONLY
    message: Expiry and low-stock status MUST NOT be conveyed by colour alone
    severity: high
  - id: NC-KB-NO-UP-DRAG
    message: The board bar MUST NOT increase the amount (down-only); increases happen in the quick-action panel
    severity: medium
  - id: NC-KB-NO-AUTO-DELETE
    message: An item at 0% MUST NOT be removed until she picks Remove (or Undo); it stays greyed at 0%
    severity: high
  - id: NC-KB-NO-REFETCH-ALL
    message: A board write MUST NOT reload whole lists; only the changed item is reconciled
    severity: medium
acceptance_criteria:
  - id: F-KB-01
    given: locations Fridge (sub-location Top shelf) and Pantry, plus an item whose location was deleted
    when: the board renders
    then: it shows cards "Fridge - Top shelf", "Pantry" and "No location", each with every item stored there reachable (the 5 most urgent show, Show all N opens the rest); No location is absent when no such item exists
    invariant: true
  - id: F-KB-02
    given: items in one location that are expired, due today to 3 days, running low and fresh
    when: the card renders
    then: items are ordered expired first, then due today to 3 days, then running low, then the rest; inside each group soonest expiry first, then by name
    invariant: false
  - id: F-KB-03
    given: items expired, expiring today, in 2 days and in 3 months
    when: they render
    then: their chips read Expired, Today, 2d and 3 mo with a text label, not colour alone
    invariant: false
  - id: F-KB-04
    given: an item at 60%
    when: she drags its bar down to 35% and releases
    then: the value snaps to 5% steps, saves on release without a dialog, and an Undo toast appears; Undo restores 60% via usage-undo; a move under 4 px is ignored; dragging above the current value is not possible on the board
    invariant: false
  - id: F-KB-05
    given: an item with 0.6 of 1 L left
    when: it renders
    then: it shows 60% and "0.6 of 1 L", and tapping the name opens the quick-action panel
    invariant: false
  - id: F-KB-06
    given: a board row
    when: she looks for the old Edit / Track usage menu
    then: there is none; both are reachable from the quick-action panel (SPEC-QP-001)
    invariant: false
  - id: F-KB-07
    given: items at 25%, 18% and 8% with low_stock_threshold 20, and one at 25% with threshold 30
    when: they render
    then: 18% shows warning, 8% shows critical (<= 10), the 25%/20 item is normal and the 25%/30 item is warning, each with a text cue
    invariant: false
  - id: F-KB-08
    given: she drags Milk to 0%
    when: the save lands
    then: a toast reads "Milk used up · Add to shopping list · Remove"; Milk stays on its card, greyed at 0%, until she chooses (it counts under the Fresh tile unless its date says otherwise)
    invariant: false
  - id: F-KB-09
    given: an item crossing its low-stock threshold on this device
    when: the usage save returns crossedLowStock
    then: a low-stock alert is raised through SPEC-NT-001 (F-NT-03), not a no-op
    invariant: false
  - id: F-KB-10
    given: items at or below threshold with usage history
    when: she taps the Running low tile
    then: the board shows only those items (still on their location cards; places with none are left out; a second tap shows everything), and each item's panel shows the predicted run-out ("~4 days left at your pace") from SQL usage stats with no AI call
    invariant: false
  - id: F-KB-11
    given: a first visit
    when: the board renders
    then: "REMOVED (2026-11-19, UI refresh): there is no drag tip and no stored dismissal flag"
    invariant: false
  - id: F-KB-12
    given: the board header
    when: it renders
    then: "it shows title, date, item and place count, search, Scan receipt and + Add item, and four clickable tiles with counts: Expired (past its date), Use today (today through 3 days, Q7 default), Running low (low and not used up; may overlap the others) and Fresh (the rest), so every item is on at least one tile; a tile is a toggle (aria-pressed), pressing it again shows everything, there is no Clear filter bar and a status line says \"Showing 7 expired items in 4 places\"; each card's + opens the item form with that location pre-filled"
    invariant: false
  - id: F-KB-13
    given: the board
    when: she looks for the old Board/Stats toggle
    then: it is gone and the nav links to Waste & Stats (SPEC-ST-001)
    invariant: false
  - id: F-KB-14
    given: no items
    when: the board renders
    then: an empty state with "Add first item" appears
    invariant: false
  - id: F-KB-15
    given: a search term
    when: she types it
    then: the board filters in place, keeping the location cards
    invariant: false
  - id: F-KB-16
    given: the tablet and the phone signed in to the same account
    when: usage changes on the phone
    then: the tablet's board shows it within 3 seconds without a reload
    invariant: false
  - id: F-KB-17
    given: a location with 7 items, one of them expired
    when: the board renders and she presses Show all 7
    then: the card first shows its 5 most urgent items (the expired one first), Show all 7 opens it in place (aria-expanded), and that choice is remembered on this device; a card with 5 or fewer items has no button
    invariant: false
  - id: F-KB-18
    given: an item at 60%
    when: she drags its bar down and has not released yet
    then: the percent, the amount ("0.35 of 1 pcs") and the Low cue follow the bar; the save still happens once on release with one Undo
    invariant: false
  - id: F-KB-19
    given: locations with and without a chosen icon and colour
    when: the cards render
    then: each header shows its own icon and tint, or a guess from its name (freezer, fridge, counter, shelf, ...) when none was chosen
    invariant: false
depends_on:
  - SPEC-DATA-001
  - SPEC-API-001
  - SPEC-QP-001
  - SPEC-NT-001
  - SPEC-AP-001
constitution_rules:
  - AR-NO-DIRECT-API
  - AR-WRITE-PATTERN
  - AR-UNDO-KINDS
  - CS-UNDO-NOT-CONFIRM
  - CS-ACCESSIBLE-UI
  - CS-PERCENT-LOW-STOCK
  - CS-NUMBERED-CONSTANTS
